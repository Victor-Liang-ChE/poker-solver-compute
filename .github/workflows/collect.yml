# Copies a finished run's artifacts, unchanged, onto a results branch so they can be fetched with git.
# Run: gh workflow run collect.yml -f run_id=<run> -f pattern='league-part-*' -f branch=league-results
name: collect
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run whose artifacts to collect
        required: true
      pattern:
        description: Artifact name pattern
        required: true
      branch:
        description: Branch to commit them to (created from an empty tree if missing)
        required: true
      expect:
        description: Number of artifacts that must be present
        required: true
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: ${{ inputs.pattern }}
          path: out
      - name: Check every artifact is there
        run: |
          n=$(ls out | wc -l); echo "$n artifacts"; ls -la out/*
          test "$n" -eq "${{ inputs.expect }}"
      - name: Commit to ${{ inputs.branch }}
        env:
          BRANCH: ${{ inputs.branch }}
          RUN: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir repo && cd repo && git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin "$BRANCH"; then git checkout -q -b "$BRANCH" FETCH_HEAD; else git checkout -q --orphan "$BRANCH"; fi
          mkdir -p "run-$RUN"
          find ../out -type f -exec cp {} "run-$RUN/" \;
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Artifacts of run $RUN (${{ inputs.pattern }})"
          git push -q origin "$BRANCH"
          git log --oneline -1
