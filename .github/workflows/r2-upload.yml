# Uploads a solve run's .pfl files to the public flop library in R2 (bucket postflop-library, keys v2/<spot>/<flop>.pfl),
# with the same headers as the Mac uploader, skipping keys already present (aws s3 sync --size-only).
# Credentials come only from the repository Actions secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY
# (an R2 S3 token scoped to this bucket). Never triggered by pull_request, so forks cannot reach them. Until the secrets
# exist the job stops with a notice and uploads nothing.
# Run: gh workflow run r2-upload.yml -f spot=sb-bb -f run_id=<solve run id>  (or -f run_id=0 -f branch=pc-results for PC-solved records)  (solve.yml also calls it after its parts finish)
name: r2-upload
on:
  workflow_dispatch:
    inputs:
      spot:
        description: Spot id
        required: true
      run_id:
        description: The solve run whose <spot>-part-* artifacts to upload (0 when uploading from a branch)
        required: true
      branch:
        description: Optional branch holding <spot>/*.pfl solved off GitHub (the PCs); used instead of run artifacts
        required: false
        default: ''
  workflow_call:
    inputs:
      spot:
        type: string
        required: true
      run_id:
        type: string
        required: true
    secrets:
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: r2-upload-${{ inputs.spot }}
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the R2 secrets exist
        id: secrets
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::R2 secrets not set yet; nothing uploaded."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Download the solve run's artifacts
        if: steps.secrets.outputs.ok == 'true'
        run: |
          mkdir -p parts lib
          if [ -n "${{ inputs.branch }}" ]; then
            git clone -q --depth 1 -b "${{ inputs.branch }}" "https://github.com/$GITHUB_REPOSITORY.git" parts/branch
            find "parts/branch/${{ inputs.spot }}" -name '*.pfl' -exec mv -n {} lib/ \;
          else
            gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -p "${{ inputs.spot }}-part-*" -D parts
            find parts -name '*.pfl' -exec mv -n {} lib/ \;
          fi
          echo "$(ls lib | wc -l) .pfl files"
      - name: Upload the missing ones to R2
        if: steps.secrets.outputs.ok == 'true'
        run: |
          aws s3 sync lib "s3://postflop-library/v2/${{ inputs.spot }}/" --size-only --no-progress --only-show-errors \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type application/octet-stream --content-encoding br --cache-control "public, max-age=31536000, immutable"
          n=$(aws s3 ls "s3://postflop-library/v2/${{ inputs.spot }}/" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" | wc -l)
          echo "$n objects now under v2/${{ inputs.spot }}/"
